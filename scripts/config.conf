# IPv6 Tethering 配置文件
# 部署到设备: /data/local/tmp/ipv6_config.conf
# 修改后执行: sh /data/local/tmp/ipv6_tether.sh restart

# === 网络接口 ===
# 上行(WAN)接口：移动数据网卡（电信/联通/移动 通常是 rmnet_data0）
IFACE_WAN="rmnet_data0"
# 下行(LAN)接口：Android 4.4 USB共享+WiFi热点的桥接接口
IFACE_UP="bridge1"

# === RA 发送器 ===
# RA 发送间隔(秒)，间隔越小客户端获取地址越快，但耗电略增
RA_INTERVAL="3"
# RA 宣告的 MTU（IPv6 最小值 1280，适配多数运营商移动网络）
# 注意: 修改此项需重新编译 send_ra 二进制
RA_MTU="1280"
# 分发的 IPv6 DNS 服务器(逗号分隔)
DNS_SERVERS="2400:3200::1,2400:3200:baba::1"

# === DHCPv6 服务器 ===
# 是否启用 DHCPv6(1=启用,0=禁用)。纯SLAAC模式下可禁用
# 启用可提供更稳定的 DNS 和路由分发
DHCP6_ENABLE="1"

# === NDP 代理 ===
# NDP 扫描间隔(秒)，扫描客户端地址并添加代理
NDP_INTERVAL="5"

# === Magisk 开机自启 ===
# 是否安装 Magisk service.d 自启脚本(1=安装,0=不安装)
# 前提: 设备已 root 并安装 Magisk
BOOT_AUTOSTART="1"
