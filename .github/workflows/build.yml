name: Build ARM Binaries

# 触发条件：推送到 main 分支 或 打 tag 时触发
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:  # 支持手动触发

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Prepare dist directory
        run: mkdir -p dist

      # 仅编译 ARMv7（适配 Android 4.4 绝大多数设备）
      - name: Build send_ra (ARMv7)
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
          CGO_ENABLED: '0'
        run: |
          cd send_ra
          go build -ldflags="-s -w" -o ../dist/send_ra send_ra.go

      - name: Build dhcp6_server (ARMv7)
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
          CGO_ENABLED: '0'
        run: |
          cd dhcp6_server
          go build -ldflags="-s -w" -o ../dist/dhcp6_server dhcp6_server.go

      - name: List build artifacts
        run: ls -lh dist/

      # === 推送到 main 分支：上传为 workflow artifact，供下载 ===
      - name: Upload ARMv7 binaries
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: ipv6-tether-armv7
          path: |
            dist/send_ra
            dist/dhcp6_server
          retention-days: 30

      # === 打 tag 时：创建 GitHub Release 并附加二进制 ===
      - name: Create Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/send_ra
            dist/dhcp6_server
          generate_release_notes: true
