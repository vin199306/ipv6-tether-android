name: Build ARM Binaries

# 触发条件：推送到 main 分支 或 打 tag 时触发
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build send_ra (ARMv7)
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
          CGO_ENABLED: '0'
        run: |
          cd send_ra
          go build -ldflags="-s -w" -o ../send_ra send_ra.go
          cd ..

      - name: Build dhcp6_server (ARMv7)
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
          CGO_ENABLED: '0'
        run: |
          cd dhcp6_server
          go build -ldflags="-s -w" -o ../dhcp6_server dhcp6_server.go
          cd ..

      - name: Build send_ra (ARM64)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          cd send_ra
          go build -ldflags="-s -w" -o ../send_ra_arm64 send_ra.go
          cd ..

      - name: Build dhcp6_server (ARM64)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          cd dhcp6_server
          go build -ldflags="-s -w" -o ../dhcp6_server_arm64 dhcp6_server.go
          cd ..

      - name: List build artifacts
        run: ls -lh send_ra dhcp6_server send_ra_arm64 dhcp6_server_arm64

      # === 推送到 main 分支：上传为 workflow artifact，供下载 ===
      - name: Upload ARMv7 binaries
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: ipv6-tether-armv7
          path: |
            send_ra
            dhcp6_server
          retention-days: 30

      - name: Upload ARM64 binaries
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: ipv6-tether-arm64
          path: |
            send_ra_arm64
            dhcp6_server_arm64
          retention-days: 30

      # === 打 tag 时：创建 GitHub Release 并附加二进制 ===
      - name: Create Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            send_ra
            dhcp6_server
            send_ra_arm64
            dhcp6_server_arm64
          generate_release_notes: true
